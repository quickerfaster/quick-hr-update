deployment:
  tasks:
    # Paths
    - export COMPOSER_BIN=/home/quickerf/composer.phar
    #### Staging ####
    # - export REPOPATH=/home/quickerf/laravel_suites_repo/agriwatts-demo
    # - export DEPLOYPATH=/home/quickerf/agriwatts-demo

    ### Production ###
    - export REPOPATH=/home/quickerf/laravel_suites_repo/quick_hr
    - export DEPLOYPATH=/home/quickerf/quick_hr

    - export LOGDIR=/home/quickerf/deploy_logs
    - mkdir -p $LOGDIR
    - export LOGFILE=$LOGDIR/deploy_$(date +"%Y-%m-%d_%H-%M-%S").log

    # Start log
    - /bin/echo "===== Deployment started at $(date) =====" >> $LOGFILE

    # Pull latest changes from GitHub
    - /bin/echo "Pulling latest changes from GitHub..." >> $LOGFILE
    - cd $REPOPATH && /usr/bin/git pull origin main >> $LOGFILE 2>&1

    # Clean destination folder but preserve .env, .cpanel.yml, storage, bootstrap/cache
    - /bin/echo "Cleaning destination folder..." >> $LOGFILE
    - /bin/sh -c 'for f in $(/bin/ls -A "$DEPLOYPATH"); do
        [ "$f" = ".env" ] || [ "$f" = ".cpanel.yml" ] || [ "$f" = "storage" ] || [ "$f" = "bootstrap/cache" ] || /bin/rm -rf "$DEPLOYPATH/$f";
      done' >> $LOGFILE 2>&1

    # Copy repository files to deployment path
    - /bin/echo "Copying files to deployment path..." >> $LOGFILE
    - /bin/sh -c 'cd "$REPOPATH" && /bin/cp -a $(/bin/ls -A | grep -vE "^(\.git|\.env|\.cpanel\.yml)$") "$DEPLOYPATH"' >> $LOGFILE 2>&1

    # Ensure Laravel storage and cache directories exist and are writable
    - /bin/echo "Ensuring Laravel storage and cache folders exist..." >> $LOGFILE
    - /bin/sh -c '/bin/mkdir -p $DEPLOYPATH/storage/framework/cache/data \
                   $DEPLOYPATH/storage/framework/sessions \
                   $DEPLOYPATH/storage/framework/views \
                   $DEPLOYPATH/bootstrap/cache \
                   $DEPLOYPATH/storage/logs' >> $LOGFILE 2>&1

    # Install Composer locally if missing
    - /bin/echo "Checking Composer..." >> $LOGFILE
    - /bin/sh -c 'if [ ! -f "$COMPOSER_BIN" ]; then
        /bin/echo "Downloading Composer..." >> $LOGFILE &&
        cd /home/quickerf &&
        /usr/bin/curl -sS https://getcomposer.org/installer -o composer-setup.php &&
        ea-php84 composer-setup.php --quiet &&
        rm composer-setup.php &&
        /bin/echo "Composer installed successfully" >> $LOGFILE;
      fi'

    # Install/update PHP dependencies without running scripts (prevents cache errors)
    #
    # Uses 'update' (not 'install') so that quicker-faster/ui-library (*@dev)
    # always pulls the latest commit from the main branch without requiring a
    # manual composer.lock update before every deploy.
    #
    # ⚠️ WHAT CAN GO WRONG:
    #   1. A third-party package releases a breaking change → deploy fails.
    #      FIX: Pin the package in composer.json with a strict constraint
    #           (e.g. "laravel/framework": "^11.0" instead of "*").
    #   2. A package is removed from Packagist or GitHub → update fails.
    #      FIX: Temporarily change 'update' back to 'install' below so the
    #           deploy uses the last-known-good composer.lock, then resolve
    #           the missing package offline and push a fix.
    #   3. Network timeout on cPanel → update hangs.
    #      FIX: Add --timeout=300 or increase the cPanel script timeout.
    #   4. Update is slower than install (30-60s extra on first run).
    #      ACCEPTABLE: cPanel deploys are already ~2 min; the trade-off is
    #      worth it for automatic library updates.
    #
    - /bin/echo "Installing/updating PHP dependencies..." >> $LOGFILE
    - /bin/sh -c 'cd "$DEPLOYPATH" && ea-php84 "$COMPOSER_BIN" update --no-dev --no-scripts --optimize-autoloader >> "$LOGFILE" 2>&1'

    # Remove test files to prevent PHPUnit dependency errors during artisan commands
    - /bin/echo "Removing test files..." >> $LOGFILE
    - /bin/sh -c 'rm -rf "$DEPLOYPATH/app/Modules/"*/Tests "$DEPLOYPATH/tests"' >> $LOGFILE 2>&1

    # Create cache table BEFORE migrations.
    # The library service providers read from the cache during boot (discovery
    # caching, listener registry, etc.). If the cache table doesn't exist when
    # artisan migrate boots the framework, it throws: SQLSTATE[42S02]: Base
    # table or view not found: 'cache'.
    #
    # We create it via raw PDO (bypassing Laravel's boot) so the table exists
    # before the first framework bootstrap.
    - /bin/echo "Creating cache tables (pre-migration)..." >> $LOGFILE
    - /bin/sh -c 'cd "$DEPLOYPATH" && ea-php84 -r "
        \$env = parse_ini_file(\".env\");
        \$dsn = \"mysql:host={\$env[\"DB_HOST\"]};port={\$env[\"DB_PORT\"]};dbname={\$env[\"DB_DATABASE\"]}\";
        \$pdo = new PDO(\$dsn, \$env[\"DB_USERNAME\"], \$env[\"DB_PASSWORD\"], [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
        \$pdo->exec(\"CREATE TABLE IF NOT EXISTS cache (
            \`key\` VARCHAR(255) NOT NULL PRIMARY KEY,
            \`value\` MEDIUMTEXT NOT NULL,
            \`expiration\` INT NOT NULL
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4\");
        \$pdo->exec(\"CREATE TABLE IF NOT EXISTS cache_locks (
            \`key\` VARCHAR(255) NOT NULL PRIMARY KEY,
            \`owner\` VARCHAR(255) NOT NULL,
            \`expiration\` INT NOT NULL
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4\");
        echo \"Cache tables ready.\";
    " >> "$LOGFILE" 2>&1'

    # Run database migrations
    - /bin/echo "Running database migrations..." >> $LOGFILE
    - /bin/sh -c 'ea-php84 "$DEPLOYPATH/artisan" migrate --force >> "$LOGFILE" 2>&1'

    # Run Artisan post-deploy tasks (safe now that cache table exists)
    - /bin/echo "Running Artisan post-deploy tasks..." >> $LOGFILE
    - /bin/sh -c 'cd "$DEPLOYPATH" && ea-php84 artisan config:clear >> "$LOGFILE" 2>&1'
    - /bin/sh -c 'cd "$DEPLOYPATH" && ea-php84 artisan cache:clear >> "$LOGFILE" 2>&1'
    - /bin/sh -c 'cd "$DEPLOYPATH" && ea-php84 artisan package:discover >> "$LOGFILE" 2>&1'
    # - /bin/sh -c 'cd "$DEPLOYPATH" && ea-php84 artisan config:cache >> "$LOGFILE" 2>&1'

    # Graceful route & view caching - try but don't fail
    - /bin/echo "Attempting route cache..." >> $LOGFILE
    # - /bin/sh -c 'cd "$DEPLOYPATH" && ea-php84 artisan route:cache >> "$LOGFILE" 2>&1' || /bin/echo "Route caching skipped (normal for multi-tenant)" >> $LOGFILE
    # - /bin/sh -c 'cd "$DEPLOYPATH" && ea-php84 artisan view:cache >> "$LOGFILE" 2>&1'

    # Seed
    - /bin/sh -c 'ea-php84 "$DEPLOYPATH/artisan" db:seed --force >> "$LOGFILE" 2>&1'

    # Final cache cleanup
    - /bin/echo "Clearing caches..." >> $LOGFILE
    - /bin/sh -c 'ea-php84 "$DEPLOYPATH/artisan" optimize:clear >> "$LOGFILE" 2>&1'

    # Optimize again
    # - /bin/sh -c 'ea-php84 "$DEPLOYPATH/artisan" optimize >> "$LOGFILE" 2>&1'

    # End log
    - /bin/echo "===== Deployment finished at $(date) =====" >> $LOGFILE

    # Rotate logs - keep only last 5
    - /bin/ls -1t $LOGDIR/deploy_*.log | /usr/bin/tail -n +6 | /bin/xargs -r /bin/rm --

#* * * * * cd /home/quickerf/quick_hr && php artisan queue:work --once --stop-when-empty --sleep=3 --tries=1 >> storage/logs/worker.log 2>&1
#/home/quickerf/quick_hr/worker.sh >> /dev/null 2>&1
